name: Documentation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_docs.py
      - run: python3 -B scripts/test_spec_loading.py
      - run: python3 -B scripts/test_source_snapshot.py
      - run: python3 -B scripts/test_diagnostic_boundaries.py
      - run: git diff --check
